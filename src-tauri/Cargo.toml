[package]
name = "rashbase-studio"
version = "0.2.0"
description = "Free, AI-native database client"
authors = ["Native Productions"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "rashbase_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes a transparent window legal on macOS, and a
# transparent window is what the vibrancy effect renders behind. It also makes
# the build ineligible for the Mac App Store; distribution here is direct
# download and Homebrew, so that is not a cost we pay.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
] }
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "rt-multi-thread"] }

# Redis. `tokio-comp` is the async runtime glue; no cluster or TLS features,
# because a tunnelled connection is already encrypted by SSH and a direct one
# is reached the same way `sqlx` reaches Postgres.
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
futures = "0.3"
# `Arc<dyn Session>` needs object-safe async methods, which native `async fn`
# in traits still does not give.
async-trait = "0.1"

# Credentials: macOS Keychain / Windows Credential Manager / Linux Secret Service
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

# Export: gzip for a single dumped file, tar for the per-table archive. `tar`
# needs each entry's size up front, which is why that layout stages its files
# on disk before it builds the archive.
flate2 = "1"
tar = "0.4"

thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
russh = { version = "0.62.6", default-features = false, features = ["ring", "rsa", "flate2"] }
tauri-plugin-dialog = "2"

# Touch ID. `LocalAuthentication` is the only way to ask macOS for a
# fingerprint, and it is Objective-C, so these are the bindings for it: `objc2`
# is the runtime, `block2` is the completion block `evaluatePolicy` answers
# through, and the other two are the frameworks themselves.
#
# Target-gated because Touch ID is macOS. Windows Hello would be a second
# implementation behind the same `biometric` module, not a widening of this.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
# Default features pull in `objc2-security` for the private-key APIs, which
# nothing here uses. Only the context and its reply block.
objc2-local-authentication = { version = "0.3", default-features = false, features = [
    "std",
    "LAContext",
    "block2",
] }
block2 = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
