name: release

# Dispatch-only on purpose. `scripts/release.sh` pushes the tag and then
# triggers this workflow with `gh workflow run`, which is what lets a release
# target a subset of platforms. A `push: tags` trigger would fire a second,
# unfiltered build for the same tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true
      platforms:
        description: 'Comma-separated: macos, windows, linux'
        required: false
        default: 'macos,windows,linux'

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - id: select
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail

          # `key` is what the caller selects on; macos deliberately maps to two
          # legs because a universal release needs both Apple architectures.
          all='[
            {"key":"macos",   "platform":"macos-latest",  "args":"--target aarch64-apple-darwin", "name":"macOS (Apple Silicon)"},
            {"key":"macos",   "platform":"macos-latest",  "args":"--target x86_64-apple-darwin",  "name":"macOS (Intel)"},
            {"key":"linux",   "platform":"ubuntu-22.04",  "args":"",                              "name":"Linux (x86_64)"},
            {"key":"windows", "platform":"windows-latest","args":"",                              "name":"Windows (x64)"}
          ]'

          selected="$(printf '%s' "$PLATFORMS" | tr -d '[:blank:]' | tr ',' '\n' | grep -v '^$' | sort -u)"
          [ -n "$selected" ] || { echo "::error::no platforms selected"; exit 1; }

          known="$(printf '%s' "$all" | jq -r '.[].key' | sort -u)"
          unknown="$(comm -23 <(printf '%s\n' "$selected") <(printf '%s\n' "$known") || true)"
          if [ -n "$unknown" ]; then
            echo "::error::unknown platform(s): $(printf '%s' "$unknown" | tr '\n' ' ')(known: $(printf '%s' "$known" | tr '\n' ' '))"
            exit 1
          fi

          include="$(printf '%s' "$all" | jq -c \
            --argjson want "$(printf '%s' "$selected" | jq -R . | jq -s .)" \
            '[.[] | select(.key as $k | $want | index($k))]')"

          echo "Building: $(printf '%s' "$include" | jq -r '[.[].name] | join(", ")')"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # WebKitGTK and friends ship as dev packages the runner image does not
      # carry. This is Tauri v2's Ubuntu prerequisite list; note that it is
      # libayatana-appindicator3-dev, NOT libappindicator3-dev -- the two
      # conflict and installing both fails the job.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: 'Rashbase Studio __VERSION__'
          releaseBody: |
            ## Install

            **macOS and Linux**

            ```sh
            curl -fsSL https://raw.githubusercontent.com/native-productions/rashbase-studio/main/scripts/install.sh | bash
            ```

            **Windows**

            ```powershell
            irm https://raw.githubusercontent.com/native-productions/rashbase-studio/main/scripts/install.ps1 | iex
            ```

            Or grab an installer from the assets below: `.dmg` for macOS
            (`aarch64` = Apple Silicon, `x64` = Intel), `-setup.exe` or `.msi`
            for Windows, `.deb` / `.rpm` / `.AppImage` for Linux.

            ## These builds are not signed

            Rashbase Studio has no Apple Developer or Windows code-signing
            certificate yet, so both operating systems will warn you the first
            time you open it. The scripts above handle macOS for you. If you
            downloaded the installer by hand instead:

            **macOS** — macOS quarantines the app and refuses to launch it
            ("damaged and can't be opened"). Clear the flag once, after moving
            the app into `/Applications`:

            ```sh
            xattr -dr com.apple.quarantine "/Applications/Rashbase Studio.app"
            ```

            **Windows** — SmartScreen shows "Windows protected your PC". Click
            **More info**, then **Run anyway**.

            **Linux** — no warning; nothing to do.

          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
