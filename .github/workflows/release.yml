name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # WebKitGTK and friends are only present on the Linux runner image as dev
      # packages we have to pull in ourselves.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Rashbase Studio __VERSION__'
          releaseBody: |
            ## Install

            **macOS and Linux**

            ```sh
            curl -fsSL https://raw.githubusercontent.com/native-productions/rashbase-studio/main/scripts/install.sh | bash
            ```

            **Windows**

            ```powershell
            irm https://raw.githubusercontent.com/native-productions/rashbase-studio/main/scripts/install.ps1 | iex
            ```

            Or grab an installer from the assets below: `.dmg` for macOS
            (`aarch64` = Apple Silicon, `x64` = Intel), `-setup.exe` or `.msi`
            for Windows, `.deb` / `.rpm` / `.AppImage` for Linux.

            ## These builds are not signed

            Rashbase Studio has no Apple Developer or Windows code-signing
            certificate yet, so both operating systems will warn you the first
            time you open it. The scripts above handle macOS for you. If you
            downloaded the installer by hand instead:

            **macOS** — macOS quarantines the app and refuses to launch it
            ("damaged and can't be opened"). Clear the flag once, after moving
            the app into `/Applications`:

            ```sh
            xattr -dr com.apple.quarantine "/Applications/Rashbase Studio.app"
            ```

            **Windows** — SmartScreen shows "Windows protected your PC". Click
            **More info**, then **Run anyway**.

            **Linux** — no warning; nothing to do.

          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
